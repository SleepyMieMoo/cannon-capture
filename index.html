<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Cannon Capture — a battle prototype by SleepyMie. Aim your cannons, flip the board, and outlast the enemy."
    />
    <title>Cannon Capture</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      html,
      body,
      #app {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #140E0C;
      }

      #app {
        position: absolute;
        inset: 0;
      }

      /* Inside Discord's mobile app, keep the game clear of notches and system bars. */
      html.in-discord #app {
        top: var(--discord-safe-area-inset-top, env(safe-area-inset-top, 0px));
        right: var(--discord-safe-area-inset-right, env(safe-area-inset-right, 0px));
        bottom: var(--discord-safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
        left: var(--discord-safe-area-inset-left, env(safe-area-inset-left, 0px));
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
